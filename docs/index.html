<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Workshop Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    transition: background-color 0.4s ease;
    cursor: pointer;
  }
  .state {
    font-size: clamp(48px, 18vw, 110px);
    font-weight: 800;
    letter-spacing: 4px;
    line-height: 1;
  }
  .desc {
    font-size: clamp(18px, 5.5vw, 30px);
    margin-top: 22px;
    line-height: 1.5;
    max-width: 34ch;
  }
  .hint {
    position: absolute;
    bottom: 16px;
    font-size: 13px;
    opacity: 0.55;
    letter-spacing: 1px;
  }
  .dot {
    font-size: clamp(60px, 20vw, 120px);
    margin-bottom: 10px;
  }
  /* state themes */
  .open  { background: #1a7a1a; color: #eaffea; }
  .tune  { background: #b36b00; color: #fff6e5; }
  .unav  { background: #a11a1a; color: #ffeaea; }
</style>
</head>
<body class="open">
  <div class="dot">🟢</div>
  <div class="state" id="state">OPEN</div>
  <div class="desc" id="desc">Come bring your robot for tuning</div>
  <div class="hint">tap to change &nbsp;·&nbsp; Pedro Pathing Workshop</div>

<script>
  const STATES = [
    { cls: 'open', dot: '🟢', name: 'OPEN',
      desc: 'Come bring your robot for tuning' },
    { cls: 'tune', dot: '🟠', name: 'TUNING',
      desc: 'Do not disturb. Please wait' },
    { cls: 'unav', dot: '🔴', name: 'UNAVAILABLE',
      desc: "I am not available at the moment" },
  ];
  let i = 0;

  function render() {
    const s = STATES[i];
    document.body.className = s.cls;
    document.querySelector('.dot').textContent = s.dot;
    document.getElementById('state').textContent = s.name;
    document.getElementById('desc').textContent = s.desc;
    try { localStorage.setItem('ws', i); } catch (e) {}
  }

  try { i = parseInt(localStorage.getItem('ws') || '0', 10) || 0; } catch (e) {}
  render();

  document.body.addEventListener('click', () => {
    i = (i + 1) % STATES.length;
    render();
  });

  // keep the screen awake while it's being a sign
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}
  }
  document.addEventListener('click', keepAwake);
  document.addEventListener('visibilitychange', keepAwake);
  keepAwake();
</script>
</body>
</html>
